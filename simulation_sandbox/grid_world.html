<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid World Simulator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20272d;
      background: #eef1f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      color: #f5f7f7;
      background: #252c31;
      border-bottom: 1px solid #101417;
    }

    .title {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd3d6;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d69a45;
    }

    .status-dot.running {
      background: #36a277;
    }

    .status-dot.collision,
    .status-dot.offline {
      background: #d45c55;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      min-height: 0;
    }

    .viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 18px;
      background: #dfe4e5;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #f8f9f7;
      border: 1px solid #aeb8bb;
    }

    .panel {
      min-width: 0;
      overflow-y: auto;
      background: #f7f8f6;
      border-left: 1px solid #bcc5c7;
    }

    .section {
      padding: 17px 18px;
      border-bottom: 1px solid #d5dbdc;
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      color: #343c41;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
      margin: 0;
    }

    .metric dt {
      margin-bottom: 3px;
      font-size: 11px;
      color: #707a7e;
    }

    .metric dd {
      margin: 0;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      color: #1f292e;
    }

    .wheel-control + .wheel-control {
      margin-top: 18px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #4b555a;
    }

    .speed-input {
      width: 82px;
      height: 30px;
      padding: 4px 7px;
      color: #20272d;
      background: #fff;
      border: 1px solid #aeb8bb;
      border-radius: 3px;
    }

    .pose-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .pose-field {
      min-width: 0;
    }

    .pose-field label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      color: #707a7e;
    }

    .pose-input {
      width: 100%;
      height: 32px;
      min-width: 0;
      padding: 4px 6px;
      color: #20272d;
      background: #fff;
      border: 1px solid #aeb8bb;
      border-radius: 3px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #217f83;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 36px;
      padding: 7px 10px;
      color: #263035;
      background: #fff;
      border: 1px solid #aeb8bb;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #edf1f0;
      border-color: #899699;
    }

    button.primary {
      color: #fff;
      background: #217f83;
      border-color: #176a6e;
    }

    button.primary:hover {
      background: #176f73;
    }

    .legend {
      display: grid;
      gap: 9px;
      font-size: 12px;
      color: #596469;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .swatch {
      width: 18px;
      height: 4px;
      background: #d9654f;
    }

    .swatch.robot {
      height: 12px;
      background: #217f83;
      border: 1px solid #165b5e;
    }

    .swatch.obstacle {
      height: 12px;
      background: #566168;
    }

    .swatch.plan {
      height: 0;
      background: transparent;
      border-top: 3px dashed #5871a7;
    }

    .swatch.target {
      height: 12px;
      background: #f4e9ee;
      border: 2px dashed #a45a7c;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(420px, 62vh) auto;
      }

      .panel {
        border-top: 1px solid #bcc5c7;
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">Grid World Simulator</h1>
      <div class="status" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </header>

    <div class="workspace">
      <section class="viewport" aria-label="Simulation viewport">
        <canvas id="worldCanvas"></canvas>
      </section>

      <aside class="panel">
        <section class="section">
          <h2>Robot State</h2>
          <dl class="metrics">
            <div class="metric"><dt>X</dt><dd id="poseX">0.000 m</dd></div>
            <div class="metric"><dt>Y</dt><dd id="poseY">0.000 m</dd></div>
            <div class="metric"><dt>Yaw</dt><dd id="poseYaw">0.0 deg</dd></div>
            <div class="metric"><dt>Time</dt><dd id="simTime">0.00 s</dd></div>
          </dl>
        </section>

        <section class="section">
          <h2>Wheel Speeds</h2>
          <div class="wheel-control">
            <label class="control-label" for="leftRange">
              <span>Left wheel</span>
              <input id="leftNumber" class="speed-input" type="number" min="-1.5" max="1.5" step="0.05" value="0">
            </label>
            <input id="leftRange" type="range" min="-1.5" max="1.5" step="0.05" value="0">
          </div>
          <div class="wheel-control">
            <label class="control-label" for="rightRange">
              <span>Right wheel</span>
              <input id="rightNumber" class="speed-input" type="number" min="-1.5" max="1.5" step="0.05" value="0">
            </label>
            <input id="rightRange" type="range" min="-1.5" max="1.5" step="0.05" value="0">
          </div>
        </section>

        <section class="section">
          <h2>Simulation</h2>
          <div class="actions">
            <button id="runButton" class="primary" type="button">Run</button>
            <button id="pauseButton" type="button">Pause</button>
            <button id="clearButton" type="button">Clear trail</button>
          </div>
        </section>

        <section class="section">
          <h2>Robot Pose</h2>
          <div class="pose-grid">
            <div class="pose-field">
              <label for="resetX">X (m)</label>
              <input id="resetX" class="pose-input" type="number" step="0.1" value="1.0">
            </div>
            <div class="pose-field">
              <label for="resetY">Y (m)</label>
              <input id="resetY" class="pose-input" type="number" step="0.1" value="1.0">
            </div>
            <div class="pose-field">
              <label for="resetYaw">Yaw (deg)</label>
              <input id="resetYaw" class="pose-input" type="number" step="5" value="0">
            </div>
          </div>
          <button id="resetButton" type="button">Reset to pose</button>
        </section>

        <section class="section">
          <h2>Navigation Preview</h2>
          <div class="pose-grid">
            <div class="pose-field">
              <label for="targetX">X (m)</label>
              <input id="targetX" class="pose-input" type="number" step="0.1" value="6.0">
            </div>
            <div class="pose-field">
              <label for="targetY">Y (m)</label>
              <input id="targetY" class="pose-input" type="number" step="0.1" value="4.5">
            </div>
            <div class="pose-field">
              <label for="targetYaw">Yaw (deg)</label>
              <input id="targetYaw" class="pose-input" type="number" step="5" value="0">
            </div>
          </div>
          <div class="actions">
            <button id="targetButton" type="button">Set target</button>
            <button id="clearPlanButton" type="button">Clear plan</button>
          </div>
        </section>

        <section class="section">
          <h2>Display</h2>
          <div class="legend">
            <div class="legend-row"><span class="swatch robot"></span><span>Robot and heading</span></div>
            <div class="legend-row"><span class="swatch"></span><span>Driven trajectory</span></div>
            <div class="legend-row"><span class="swatch plan"></span><span>Planned trajectory</span></div>
            <div class="legend-row"><span class="swatch target"></span><span>Target pose</span></div>
            <div class="legend-row"><span class="swatch obstacle"></span><span>Occupied grid cells</span></div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("worldCanvas");
    const context = canvas.getContext("2d");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const leftRange = document.getElementById("leftRange");
    const leftNumber = document.getElementById("leftNumber");
    const rightRange = document.getElementById("rightRange");
    const rightNumber = document.getElementById("rightNumber");
    const resetX = document.getElementById("resetX");
    const resetY = document.getElementById("resetY");
    const resetYaw = document.getElementById("resetYaw");
    const targetX = document.getElementById("targetX");
    const targetY = document.getElementById("targetY");
    const targetYaw = document.getElementById("targetYaw");

    let simulatorState = null;
    let controlTimer = null;
    let polling = false;
    let suspendControlSyncUntil = 0;

    async function request(path, method = "GET", payload = null) {
      const options = { method, headers: {} };
      if (payload !== null) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(payload);
      }
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || `Request failed: ${response.status}`);
      }
      return data;
    }

    function scheduleControlUpdate() {
      window.clearTimeout(controlTimer);
      suspendControlSyncUntil = Date.now() + 500;
      controlTimer = window.setTimeout(async () => {
        try {
          await request("/control", "POST", {
            left_speed: Number(leftNumber.value),
            right_speed: Number(rightNumber.value),
          });
        } catch (error) {
          setOffline(error.message);
        }
      }, 60);
    }

    function bindSpeedInputs(rangeInput, numberInput) {
      rangeInput.addEventListener("input", () => {
        numberInput.value = rangeInput.value;
        scheduleControlUpdate();
      });
      numberInput.addEventListener("input", () => {
        const value = Math.max(-1.5, Math.min(1.5, Number(numberInput.value) || 0));
        rangeInput.value = String(value);
        scheduleControlUpdate();
      });
    }

    bindSpeedInputs(leftRange, leftNumber);
    bindSpeedInputs(rightRange, rightNumber);

    document.getElementById("runButton").addEventListener("click", () => sendCommand("/run"));
    document.getElementById("pauseButton").addEventListener("click", () => sendCommand("/pause"));
    document.getElementById("clearButton").addEventListener("click", () => sendCommand("/clear_trajectory"));
    document.getElementById("resetButton").addEventListener("click", async () => {
      leftRange.value = "0";
      leftNumber.value = "0";
      rightRange.value = "0";
      rightNumber.value = "0";
      await sendCommand("/reset", poseFromInputs(resetX, resetY, resetYaw));
    });
    document.getElementById("targetButton").addEventListener("click", () => {
      sendCommand("/navigation_plan", {
        target: poseFromInputs(targetX, targetY, targetYaw),
        path: [],
      });
    });
    document.getElementById("clearPlanButton").addEventListener("click", () => {
      sendCommand("/clear_navigation_plan");
    });

    function poseFromInputs(xInput, yInput, yawInput) {
      return {
        x: Number(xInput.value),
        y: Number(yInput.value),
        yaw: Number(yawInput.value) * Math.PI / 180,
      };
    }

    async function sendCommand(path, payload = {}) {
      try {
        simulatorState = await request(path, "POST", payload);
        renderState();
      } catch (error) {
        setOffline(error.message);
      }
    }

    async function pollState() {
      if (polling) return;
      polling = true;
      try {
        simulatorState = await request("/state");
        renderState();
      } catch (error) {
        setOffline(error.message);
      } finally {
        polling = false;
      }
    }

    function setOffline(message) {
      statusDot.className = "status-dot offline";
      statusText.textContent = message || "Disconnected";
    }

    function renderState() {
      if (!simulatorState) return;
      const robot = simulatorState.robot;
      document.getElementById("poseX").textContent = `${robot.x.toFixed(3)} m`;
      document.getElementById("poseY").textContent = `${robot.y.toFixed(3)} m`;
      document.getElementById("poseYaw").textContent = `${(robot.yaw * 180 / Math.PI).toFixed(1)} deg`;
      document.getElementById("simTime").textContent = `${simulatorState.simulation_time.toFixed(2)} s`;
      syncSpeedDisplay(leftRange, leftNumber, robot.left_speed);
      syncSpeedDisplay(rightRange, rightNumber, robot.right_speed);

      if (robot.collision) {
        statusDot.className = "status-dot collision";
        statusText.textContent = "Collision stop";
      } else if (robot.running) {
        statusDot.className = "status-dot running";
        statusText.textContent = "Running";
      } else {
        statusDot.className = "status-dot";
        statusText.textContent = "Paused";
      }
      drawWorld();
    }

    function syncSpeedDisplay(rangeInput, numberInput, value) {
      if (
        Date.now() < suspendControlSyncUntil
        || document.activeElement === rangeInput
        || document.activeElement === numberInput
      ) {
        return;
      }
      const displayValue = value.toFixed(2);
      rangeInput.value = displayValue;
      numberInput.value = displayValue;
    }

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(bounds.width * ratio));
      canvas.height = Math.max(1, Math.floor(bounds.height * ratio));
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawWorld();
    }

    function drawWorld() {
      const bounds = canvas.getBoundingClientRect();
      context.clearRect(0, 0, bounds.width, bounds.height);
      context.fillStyle = "#f8f9f7";
      context.fillRect(0, 0, bounds.width, bounds.height);
      if (!simulatorState) return;

      const world = simulatorState.world;
      const margin = 26;
      const scale = Math.min(
        (bounds.width - margin * 2) / world.width,
        (bounds.height - margin * 2) / world.height,
      );
      const drawingWidth = world.width * scale;
      const drawingHeight = world.height * scale;
      const originX = (bounds.width - drawingWidth) / 2;
      const originY = (bounds.height - drawingHeight) / 2;

      const point = (x, y) => ({
        x: originX + x * scale,
        y: originY + (world.height - y) * scale,
      });

      context.fillStyle = "#ffffff";
      context.fillRect(originX, originY, drawingWidth, drawingHeight);
      context.strokeStyle = "#d7ddde";
      context.lineWidth = 1;
      context.beginPath();
      for (let column = 0; column <= world.columns; column += 1) {
        const x = originX + column * world.cell_size * scale;
        context.moveTo(x, originY);
        context.lineTo(x, originY + drawingHeight);
      }
      for (let row = 0; row <= world.rows; row += 1) {
        const y = originY + row * world.cell_size * scale;
        context.moveTo(originX, y);
        context.lineTo(originX + drawingWidth, y);
      }
      context.stroke();

      context.fillStyle = "#566168";
      for (const obstacle of world.obstacles) {
        const topLeft = point(
          obstacle.column * world.cell_size,
          (obstacle.row + 1) * world.cell_size,
        );
        const cellPixels = world.cell_size * scale;
        context.fillRect(topLeft.x + 1, topLeft.y + 1, cellPixels - 2, cellPixels - 2);
      }

      const plannedPath = simulatorState.planned_path;
      if (plannedPath.length > 1) {
        context.save();
        context.strokeStyle = "#5871a7";
        context.lineWidth = 2.5;
        context.setLineDash([8, 6]);
        context.lineJoin = "round";
        context.lineCap = "round";
        context.beginPath();
        plannedPath.forEach((sample, index) => {
          const screen = point(sample.x, sample.y);
          if (index === 0) context.moveTo(screen.x, screen.y);
          else context.lineTo(screen.x, screen.y);
        });
        context.stroke();
        context.restore();
      }

      const trajectory = simulatorState.trajectory;
      if (trajectory.length > 1) {
        context.strokeStyle = "#d9654f";
        context.lineWidth = 2.5;
        context.lineJoin = "round";
        context.lineCap = "round";
        context.beginPath();
        trajectory.forEach((sample, index) => {
          const screen = point(sample.x, sample.y);
          if (index === 0) context.moveTo(screen.x, screen.y);
          else context.lineTo(screen.x, screen.y);
        });
        context.stroke();
      }

      const robot = simulatorState.robot;
      const drawPose = (pose, fillColor, borderColor, arrowColor, dashed = false) => {
        const center = point(pose.x, pose.y);
        const length = robot.length * scale;
        const width = robot.width * scale;
        context.save();
        context.translate(center.x, center.y);
        context.rotate(-pose.yaw);
        context.fillStyle = fillColor;
        context.strokeStyle = borderColor;
        context.lineWidth = 2;
        context.setLineDash(dashed ? [6, 4] : []);
        context.fillRect(-length / 2, -width / 2, length, width);
        context.strokeRect(-length / 2, -width / 2, length, width);
        context.setLineDash([]);
        context.strokeStyle = arrowColor;
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(length * 0.7, 0);
        context.lineTo(length * 0.52, -width * 0.2);
        context.moveTo(length * 0.7, 0);
        context.lineTo(length * 0.52, width * 0.2);
        context.stroke();
        context.restore();
      };

      if (simulatorState.target_pose) {
        drawPose(simulatorState.target_pose, "#f4e9ee", "#a45a7c", "#a45a7c", true);
      }
      drawPose(robot, "#217f83", "#165b5e", "#f2c14e");

      context.strokeStyle = "#7f8a8e";
      context.lineWidth = 1.5;
      context.strokeRect(originX, originY, drawingWidth, drawingHeight);
    }

    new ResizeObserver(resizeCanvas).observe(canvas);
    window.setInterval(pollState, 50);
    pollState();
  </script>
</body>
</html>
